name: UniFi diagnostics CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q diagnostics
      - run: python -m unittest discover -s diagnostics -p 'test_*.py' -v
      - run: python diagnostics/unifi_diagnostics.py --help
